name: Lint and Build

on:
  pull_request:
    branches: [master]
  push:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      # PyGObject and pycairo are built from source here, and the runner image
      # carries none of the headers they need. Versions are those in Ubuntu
      # 24.04, which is what ubuntu-latest resolves to: girepository-2.0 and
      # glib are 2.80.0, and PyGObject 3.56 asks for 2.80.0 or later.
      - name: Install PyGObject build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libcairo2-dev libgirepository-2.0-dev libffi-dev

      - name: Install dependencies
        run: uv sync

      - name: Run pre-commit
        run: uv run pre-commit run --verbose --all-files

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - run: uv build
